<!doctype html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rosengård Friland gårdbutik.">
  <meta name="theme-color" content="#2f241a">
  <title>Rosengård Friland</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:opsz@9..40&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    function GardenPage() {
      const cards = [
        { title: "Se gårdbutik", image: "butik.jpg", position: "center 35%" },
        { title: "Bestil fjerkræ", image: "høns.jpg", position: "center 55%" },
        { title: "Book ophold", image: "ophold.webp", position: "center 75%" }
      ];

      return (
        <main>
          <section className="hero-section">
            <img
              src="hero.png"
              alt="Rosengård Friland"
              className="hero-bg"
            />
            <div className="hero-overlay" />
            <img
              src="logo_Nero_AI_Image_Upscaler_Photo_Face-removebg-preview.png"
              alt="Rosengård Friland logo"
              className="hero-logo"
            />

            <div className="hero-content">
            <h1 className="hero-title">
              Rosengård Friland
            </h1>

            <p className="hero-subtitle">
              Bondegårdsferie og aktivitetshus • Ferielejlighed og B&B • Gårdbutik, fjerkræ- og dyresalg
            </p>

            <div className="cards-grid">
              {cards.map((card) => (
                <button
                  key={card.title}
                  type="button"
                  className="card-button"
                  style={{ backgroundImage: `url(${card.image})`, backgroundPosition: card.position }}
                >
                  <span className="card-overlay" aria-hidden="true" />
                  <span className="card-text">{card.title}</span>
                </button>
              ))}
            </div>
            </div>
            </section>
          
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<GardenPage />);
  </script>
</body>
</html>
