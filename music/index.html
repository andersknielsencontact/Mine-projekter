<!doctype html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="North Note musik- og kulturhus i Odense.">
  <meta name="theme-color" content="#efe5d4">
  <title>North Note Musik- og Kulturhus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:opsz@9..40&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/tailwindcss-cdn@3.4.1/tailwindcss.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    function MusicSchoolLandingPage() {
      const [isMenuOpen, setIsMenuOpen] = React.useState(false);
      const [isScrolled, setIsScrolled] = React.useState(false);
      const menuItems = [
        ["Forside", "#top"],
        ["Kurser", "#kurser"],
        ["Undervisere", "#undervisere"],
        ["Alt det andet", "#alt-det-andet"],
        ["Nyhedsbrev", "#nyhedsbrev"],
        ["FAQ", "#faq"],
        ["Info", "#find-os"],
        ["Kontakt", "#kontakt"],
        ["English", "#"],
      ];

      React.useEffect(() => {
        const onScroll = () => setIsScrolled(window.scrollY > 12);
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      return (
        <div className="min-h-screen bg-[#efe5d4] text-stone-900" style={{ fontFamily: "'Nunito Sans', sans-serif" }}>
          <header className={`fixed inset-x-0 top-0 z-40 transition-all duration-300 ${isScrolled ? "border-b border-[#7b5a3a]/10 bg-[#efe5d4]/90 backdrop-blur" : "bg-transparent"}`}>
            <div className="max-w-7xl mx-auto px-4 lg:px-5 py-3 flex items-center justify-between gap-4">
              <a href="#top" className={`text-lg font-bold tracking-tight transition-colors duration-300 lg:-ml-16 ${isScrolled ? "text-stone-900" : "text-white"}`}>
                North Note <span className={`font-medium transition-colors duration-300 ${isScrolled ? "text-[#9f5c28]" : "text-[#e5bf82]"}`}>Musikskole</span>
              </a>

              <nav className="hidden lg:flex items-center gap-2 text-sm">
                {menuItems.map(([label, href]) => (
                  <a
                    key={label}
                    href={href}
                    target={label === "English" ? "_blank" : undefined}
                    rel={label === "English" ? "noreferrer" : undefined}
                    className={`px-2.5 py-1.5 rounded-full border transition-colors duration-200 ease-out ${isScrolled ? "border-[#7b5a3a]/15 text-stone-700 hover:text-stone-900 hover:border-[#b86b2d]/60 hover:bg-[#e9d6b6]/70" : "border-white/30 text-white hover:text-white hover:border-white/50 hover:bg-white/12"}`}
                  >
                    {label}
                  </a>
                ))}
              </nav>

              <a
                href="tel:12345678"
                className={`hidden lg:inline-flex items-center rounded-full px-4 py-2 text-sm font-semibold border transition-colors duration-200 ease-out ${isScrolled ? "border-[#7b5a3a]/20 text-stone-800 hover:border-[#b86b2d]/60 hover:bg-[#e9d6b6]/70" : "border-white/35 text-white hover:border-white/55 hover:bg-white/12"}`}
              >
                Ring
              </a>

              <button
                type="button"
                className={`lg:hidden px-3 py-2 rounded-full border text-sm font-semibold transition-colors duration-200 ease-out ${isScrolled ? "border-[#7b5a3a]/20 text-stone-800 hover:bg-[#e9d6b6]/70" : "border-white/35 text-white hover:bg-white/12"}`}
                onClick={() => setIsMenuOpen((prev) => !prev)}
                aria-expanded={isMenuOpen}
                aria-controls="mobile-main-menu"
              >
                Menu
              </button>
            </div>

            {isMenuOpen && (
              <div id="mobile-main-menu" className={`lg:hidden px-6 py-3 ${isScrolled ? "border-t border-[#7b5a3a]/10" : "border-t border-white/20 bg-black/25 backdrop-blur-sm"}`}>
                <nav className="flex flex-col gap-2 text-sm">
                  {menuItems.map(([label, href]) => (
                    <a
                      key={`mobile-${label}`}
                      href={href}
                      target={label === "English" ? "_blank" : undefined}
                      rel={label === "English" ? "noreferrer" : undefined}
                      onClick={() => setIsMenuOpen(false)}
                      className={`px-3 py-2 rounded-lg border transition-colors duration-200 ease-out ${isScrolled ? "border-[#7b5a3a]/10 text-stone-700 hover:text-stone-900 hover:border-[#b86b2d]/60 hover:bg-[#e9d6b6]/70" : "border-white/25 text-white hover:text-white hover:border-white/45 hover:bg-white/12"}`}
                    >
                      {label}
                    </a>
                  ))}
                </nav>
              </div>
            )}
          </header>

          <section id="top" className="relative overflow-hidden border-b border-[#7b5a3a]/10 text-white">
            <img
              src="musikheroimg.avif"
              alt="Nærværende musikundervisning i mindre hold"
              className="absolute inset-0 h-full w-full object-cover object-center"
            />
            <div className="absolute inset-0 bg-[#0f1421]/56" />
            <div className="absolute inset-0 bg-gradient-to-r from-black/80 via-black/55 to-black/20" />
            <div className="absolute inset-0 bg-gradient-to-t from-black/35 via-transparent to-transparent" />

            <div className="relative max-w-7xl mx-auto px-6 py-36 lg:py-56">
              <div className="max-w-3xl">
                <div className="mb-7">
                  <p className="text-[2.5rem] lg:text-[3.4rem] font-black leading-none tracking-[-0.03em] text-white" style={{ fontFamily: "'DM Serif Display', serif" }}>
                    North Note
                  </p>
                  <div className="mt-2 h-[2px] w-44 bg-gradient-to-r from-[#e5bf82] via-[#d4b08a]/80 to-transparent" />
                  <p className="mt-2 text-xs uppercase tracking-[0.24em] text-slate-200">Musik- og Kulturhus i Odense</p>
                </div>

                <h1 className="text-5xl lg:text-6xl xl:text-7xl font-black leading-tight tracking-tight mb-6 max-w-[13ch] drop-shadow-[0_3px_12px_rgba(0,0,0,0.65)]" style={{ fontFamily: "'DM Serif Display', serif" }}>
                  Spil med andre.<span className="block text-[#e5bf82]">Bliv bedre sammen.</span>
                </h1>

                <p className="text-lg text-slate-100 leading-relaxed max-w-xl mb-10 drop-shadow-[0_2px_8px_rgba(0,0,0,0.6)]">
                  Se hold, mød underviserne og kontakt os om opstart og tilmelding.
                </p>

                <div className="flex flex-wrap gap-4">
                  <a href="#kontakt" className="px-8 py-4 bg-[#b86b2d] hover:bg-[#c77a3a] transition-colors duration-200 ease-out rounded-2xl font-semibold text-lg shadow-2xl shadow-[#8b4f22]/20">
                    Kontakt os
                  </a>

                  <a href="#kurser" className="px-8 py-4 border border-white/35 hover:bg-white/15 transition-colors duration-200 ease-out rounded-2xl font-semibold text-lg">
                    Se fag og hold
                  </a>
                </div>

              </div>
            </div>
          </section>

          <section id="kurser" className="scroll-mt-24 relative overflow-hidden border-y border-[#9b8e7b]/30 bg-[#343a4b] text-slate-100">
            <div
              className="absolute inset-0"
              style={{
                backgroundImage: "repeating-linear-gradient(to bottom, rgba(255,255,255,0.05) 0 1px, transparent 1px 22px)",
                opacity: 0.1,
              }}
            />
            <div className="relative max-w-7xl mx-auto px-6 py-28">
              <div className="flex items-end justify-between gap-8 mb-14">
                <div>
                  <h2 className="text-5xl lg:text-6xl font-black tracking-tight leading-none" style={{ fontFamily: "'DM Serif Display', serif" }}>
                    Vælg dit fag
                  </h2>
                </div>

                <p className="hidden lg:block text-slate-300 max-w-md">
                  Klik på "Se info og hold" under et fag for at gå direkte til beskrivelser,
                  holdtider og tilmelding.
                </p>
              </div>

              <div className="grid md:grid-cols-2 xl:grid-cols-4 gap-2">
                {[
                  { tag: "STRENGE", title: "GUITAR", href: "#", image: "../img/musikheroimg.avif" },
                  { tag: "VOKAL", title: "SANG", href: "#", image: "song.avif" },
                  { tag: "STRENGE", title: "BAS", href: "#", image: "bass.avif" },
                  { tag: "BLÆSE", title: "BLÆSERE", href: "#", image: "trompet.avif" },
                  { tag: "STRENGE", title: "STRYGERE", href: "#", image: "violin.avif" },
                  { tag: "TANGENT", title: "KLAVER", href: "#", image: "piano.avif" },
                  { tag: "TRADITION", title: "FOLKEMUSIK", href: "#", image: "folkmusic.avif" },
                  { tag: "RYTME", title: "TROMMER", href: "#", image: "drums.avif" },
                  { tag: "VOKAL", title: "KOR", href: "#", image: "choir.avif" },
                  { tag: "ENSEMBLE", title: "SAMMENSPIL", href: "#", image: "band.avif" },
                  { tag: "SCENE", title: "TEATER & DANS", href: "#", image: "dance.avif" },
                  { tag: "ARRANGEMENT", title: "EVENTS", href: "#", image: "events.avif" },
                ].map((item) => (
                  <article
                    key={item.title}
                    className="group relative min-h-[240px] overflow-hidden"
                  >
                    <img
                      src={item.image}
                      alt={item.title}
                      className="absolute inset-0 h-full w-full object-cover brightness-115 contrast-105 saturate-110 transition-transform duration-300 ease-out group-hover:scale-[1.02]"
                    />
                    <div className="absolute inset-0 bg-black/40 group-hover:bg-black/25 transition-colors duration-200 ease-out" />

                    <div className="relative z-10 h-full flex flex-col items-center justify-center text-center px-4 py-6">
                      <span className="mb-2 px-2.5 py-0.5 rounded-full bg-white/15 border border-white/30 text-white text-[0.6rem] uppercase tracking-[0.18em] font-semibold">{item.tag}</span>
                      <h3 className="text-3xl lg:text-[2rem] font-black tracking-tight mb-4" style={{ fontFamily: "'DM Serif Display', serif" }}>{item.title}</h3>
                      <a
                        href={item.href}
                        target="_blank"
                        rel="noreferrer"
                        className="px-5 py-2 bg-[#b86b2d] hover:bg-[#c77a3a] transition-colors duration-200 ease-out rounded-full font-semibold text-lg text-white shadow-lg shadow-[#8b4f22]/20"
                      >
                        Se info og hold
                      </a>
                    </div>
                  </article>
                ))}
              </div>
            </div>
          </section>

          <section id="undervisere" className="scroll-mt-24 relative overflow-hidden border-y border-[#7b5a3a]/10 bg-[#e3d5bf]">
            <div className="absolute inset-0 md:hidden">
              <img
                src="sammenholdimg.png"
                alt=""
                aria-hidden="true"
                onError={(e) => {
                  e.currentTarget.onerror = null;
                  e.currentTarget.src = "../img/band.avif";
                }}
                className="h-full w-full object-cover object-center"
              />
              <div className="absolute inset-0 bg-[#1a120a]/45" />
            </div>

            <div className="relative z-10 max-w-7xl mx-auto px-6 py-20 md:py-28 grid lg:grid-cols-2 gap-16 items-center">
              <div className="hidden md:block">
                <img
                  src="../img/sammenholdimg.png"
                  alt="Sammenspil og fællesskab på tværs af niveauer"
                  onError={(e) => {
                    e.currentTarget.onerror = null;
                    e.currentTarget.src = "../img/band.avif";
                  }}
                  className="rounded-[32px] w-full h-[460px] object-cover object-center border border-[#7b5a3a]/15"
                />
              </div>

              <div>
                <p className="text-[#9f5c28] uppercase tracking-[0.2em] text-sm mb-3">
                  Mere end undervisning
                </p>

                <h2 className="text-5xl lg:text-6xl font-black leading-none tracking-tight mb-6 text-white md:text-stone-900" style={{ fontFamily: "'DM Serif Display', serif" }}>
                  Hvorfor North Note?
                </h2>

                <div className="text-slate-100 md:text-stone-700 text-lg leading-relaxed">
                  <p>
                    Hos Nort Note handler undervisning om mere end teknik. Du bliver en del af et kreativt fællesskab,
                    hvor sammenspil, sceneerfaring og personlig udvikling går hånd i hånd.
                  </p>
                </div>

                <div className="mt-8 max-w-lg space-y-3 text-slate-100 md:text-stone-700">
                  {["Små hold med plads til den enkelte", "Undervisere med både pædagogisk og scenisk erfaring", "Niveaudelt undervisning for børn, unge og voksne"].map((point) => (
                    <p key={point} className="text-sm lg:text-base border-l-2 border-[#e5bf82]/80 md:border-[#b86b2d]/60 pl-3">
                      {point}
                    </p>
                  ))}
                </div>
              </div>
            </div>
          </section>

          <section id="alt-det-andet" className="scroll-mt-24 max-w-7xl mx-auto px-6 py-24">
            <div className="grid lg:grid-cols-2 gap-10">
              <article className="h-full pt-3 border-t border-[#7b5a3a]/15 flex flex-col">
                <p className="text-[#9f5c28] uppercase tracking-[0.2em] text-xs mb-3">Andre tilbud</p>
                <h3 className="text-4xl font-black mb-4 leading-tight" style={{ fontFamily: "'DM Serif Display', serif" }}>FLOW og samarbejder</h3>
                <p className="text-stone-700 mb-6">Nort Note har også FLOW, som er et samarbejde med VUC, hvor vi kombinerer kreativ undervisning med en videregående uddannelse.</p>
                <div className="mt-auto flex flex-wrap gap-3">
                  <a href="#" target="_blank" rel="noreferrer" className="px-5 py-2 bg-[#b86b2d] hover:bg-[#c77a3a] transition-colors duration-200 ease-out rounded-full font-semibold text-white">FLOW</a>
                  <a href="http://www.moedecenter.dk/" target="_blank" rel="noreferrer" className="px-5 py-2 border border-[#7b5a3a]/20 hover:bg-[#e9d6b6]/70 transition-colors duration-200 ease-out rounded-full font-semibold">Mødecenter Odense</a>
                </div>
              </article>

              <article id="kontakt" className="h-full pt-3 border-t border-[#7b5a3a]/15 flex flex-col">
                <p className="text-[#9f5c28] uppercase tracking-[0.2em] text-xs mb-3">Kontakt</p>
                <h3 className="text-4xl font-black mb-4 leading-tight" style={{ fontFamily: "'DM Serif Display', serif" }}>Du kan også tilmelde dig pr. telefon eller e-mail</h3>
                <p className="text-stone-700 mb-2">Telefonerne er åbne mandag til torsdag fra 10.00 til 14.00.</p>
                <p className="text-stone-700 mb-6">Henvendelse efter aftale. Vi svarer gerne på dine spørgsmål.</p>
                <div className="mt-auto flex flex-wrap gap-3">
                  <a href="tel:12345678" className="px-5 py-2 bg-[#b86b2d] hover:bg-[#c77a3a] transition-colors duration-200 ease-out rounded-full font-semibold text-white">12 34 56 78</a>
                  <a href="mailto:Note-info@gmail.com" className="px-5 py-2 border border-[#7b5a3a]/20 hover:bg-[#e9d6b6]/70 transition-colors duration-200 ease-out rounded-full font-semibold">Skriv besked</a>
                </div>
              </article>
            </div>
          </section>

          <section id="nyhedsbrev" className="scroll-mt-24 max-w-5xl mx-auto px-6 py-24">
            <div className="pt-4 border-t border-[#7b5a3a]/15">
              <p className="text-[#9f5c28] uppercase tracking-[0.2em] text-xs mb-3">Nyhedsbrev</p>
              <h3 className="text-4xl font-black mb-4 leading-tight" style={{ fontFamily: "'DM Serif Display', serif" }}>Få nyt om hold og arrangementer</h3>
              <p className="text-stone-700 mb-5">Tilmeld dig og få besked om nye hold, koncerter og workshops.</p>
              <form className="flex flex-col sm:flex-row gap-3">
                <input
                  type="email"
                  placeholder="Din e-mail"
                  className="flex-1 px-4 py-3 rounded-xl bg-white border border-[#7b5a3a]/15 text-stone-900 placeholder:text-stone-500"
                  required
                />
                <button type="submit" className="px-6 py-3 bg-[#b86b2d] hover:bg-[#c77a3a] transition-colors duration-200 ease-out rounded-xl font-semibold text-white">
                  Tilmeld
                </button>
              </form>
            </div>
          </section>

          <section id="faq" className="scroll-mt-24 max-w-7xl mx-auto px-6 py-24">
            <div className="pt-4 border-t border-[#7b5a3a]/15 grid lg:grid-cols-3 gap-12">
              <div className="lg:sticky lg:top-28 self-start">
                <p className="text-[#9f5c28] uppercase tracking-[0.2em] text-xs mb-3">FAQ</p>
                <h3 className="text-4xl lg:text-5xl font-black leading-tight" style={{ fontFamily: "'DM Serif Display', serif" }}>Ofte stillede spørgsmål</h3>
                <p className="mt-4 text-stone-500 text-sm leading-relaxed">Kan du ikke finde svar her, er du altid velkommen til at ringe på <a href="tel:12345678" className="underline underline-offset-2 hover:text-[#9f5c28]">12 34 56 78</a>.</p>
              </div>
              <div className="lg:col-span-2 flex flex-col gap-0 text-stone-700">
                <details className="border-t border-[#7b5a3a]/10 pt-3">
                  <summary className="cursor-pointer font-semibold">Kan man få en prøvetime?</summary>
                  <p className="mt-2 text-sm text-stone-600">Kontakt os for at høre om muligheder for prøvetime, opstart og tilmelding.</p>
                </details>
                <details className="border-t border-[#7b5a3a]/10 pt-3">
                  <summary className="cursor-pointer font-semibold">Hvordan finder jeg ud af, hvilket hold og hvilken underviser, der er den rigtige for mig?</summary>
                  <p className="mt-2 text-sm text-stone-600">Du er altid velkommen til at ringe eller skrive en e-mail til os og høre mere om dine muligheder. Du kan også ringe direkte til underviseren, som du overvejer at starte hos.</p>
                </details>
                <details className="border-t border-[#7b5a3a]/10 pt-3">
                  <summary className="cursor-pointer font-semibold">Skal hele beløbet betales på én gang?</summary>
                  <p className="mt-2 text-sm text-stone-600">Ja, hele beløbet skal betales ved tilmelding.</p>
                </details>
                <details className="border-t border-[#7b5a3a]/10 pt-3">
                  <summary className="cursor-pointer font-semibold">Kan man købe en halv sæson?</summary>
                  <p className="mt-2 text-sm text-stone-600">Nej, du tilmelder som udgangspunkt hele sæsonen, men kontakt os for at høre om mulighederne.</p>
                </details>
                <details className="border-t border-[#7b5a3a]/10 pt-3">
                  <summary className="cursor-pointer font-semibold">Er man bundet til mere end én sæson?</summary>
                  <p className="mt-2 text-sm text-stone-600">Nej. Du tilmelder dig 1 sæson ad gangen.</p>
                </details>
                <details className="border-t border-[#7b5a3a]/10 pt-3">
                  <summary className="cursor-pointer font-semibold">Hvad sker der, hvis jeg melder afbud til en mødegang?</summary>
                  <p className="mt-2 text-sm text-stone-600">Så mister du den mødegang</p>
                </details>
                <details className="border-t border-[#7b5a3a]/10 pt-3">
                  <summary className="cursor-pointer font-semibold">Hvordan/hvor finder jeg mit hold og lokale?</summary>
                  <p className="mt-2 text-sm text-stone-600">Du kan finde dit hold og lokale ved at tjekke vores hjemmeside eller kontakte os direkte for information.</p>
                </details>
                <details className="border-t border-[#7b5a3a]/10 pt-3">
                  <summary className="cursor-pointer font-semibold">Er der parkering ved skolen?</summary>
                  <p className="mt-2 text-sm text-stone-600">Ja, der er parkeringspladser til rådighed ved skolen.</p>
                </details>
              </div>
            </div>
          </section>
          <section className="max-w-5xl mx-auto px-6 py-20 text-center">
            <div className="pt-8 border-t border-[#7b5a3a]/15">
              <h2 className="text-4xl lg:text-6xl font-black tracking-tight mb-6" style={{ fontFamily: "'DM Serif Display', serif" }}>
                Klar til at starte?
              </h2>
              <p className="text-stone-700 text-lg max-w-2xl mx-auto mb-10 leading-relaxed">
                Uanset om du er nybegynder eller erfaren,
                finder du et kreativt fællesskab hos North Note.
              </p>
              <div className="flex flex-wrap justify-center gap-4">
                <a href="#kurser" className="px-8 py-4 bg-[#b86b2d] hover:bg-[#c77a3a] transition-colors duration-200 ease-out rounded-2xl font-semibold text-lg text-white">
                  Se alle fag
                </a>
                <a href="#kontakt" className="px-8 py-4 border border-[#7b5a3a]/20 hover:bg-[#e9d6b6]/70 transition-colors duration-200 ease-out rounded-2xl font-semibold text-lg">
                  Kontakt os
                </a>
              </div>
            </div>
          </section>

          <section id="find-os" className="scroll-mt-24 border-t border-[#7b5a3a]/10 border-b bg-[#e3d5bf] border-[#7b5a3a]/10">
            <div className="max-w-7xl mx-auto px-6 py-16 grid lg:grid-cols-3 gap-8 items-start">
              <div>
                <p className="text-[#9f5c28] uppercase tracking-[0.2em] text-xs mb-3">Find os</p>
                <h3 className="text-2xl font-black mb-3" style={{ fontFamily: "'DM Serif Display', serif" }}>North Note Musik- og Kulturhus</h3>
                <p className="text-stone-700">Buchwaldsgade 48<br />5000 Odense C</p>
              </div>
              <div>
                <div className="flex flex-col gap-2">
                  <a href="https://1748.dk/dagens-bookninger" target="_blank" rel="noreferrer" className="hover:text-[#9f5c28] transition-colors duration-200 ease-out">Dagens bookninger</a>
                  <a href="https://1748.dk/info/persondatapolitik" target="_blank" rel="noreferrer" className="hover:text-[#9f5c28] transition-colors duration-200 ease-out">Persondatapolitik</a>
                  <a href="https://fora.undervisernet.dk/" target="_blank" rel="noreferrer" className="hover:text-[#9f5c28] transition-colors duration-200 ease-out">Intranet</a>
                </div>

                <p className="text-stone-600 mt-5 mb-2">Følg os</p>
                <div className="flex gap-4 text-sm">
                  <a href="https://www.instagram.com" target="_blank" rel="noreferrer" className="hover:text-[#9f5c28] transition-colors duration-200 ease-out">Instagram</a>
                  <a href="https://www.facebook.com/" target="_blank" rel="noreferrer" className="hover:text-[#9f5c28] transition-colors duration-200 ease-out">Facebook</a>
                </div>
              </div>
              <div className="lg:justify-end">
